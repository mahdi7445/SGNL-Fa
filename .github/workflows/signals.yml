name: Tradeiscool Signals

# ⚠️ این ورک‌فلو دیگر «هر ۱۵ دقیقه اجرا و خروج» نیست. علت تغییر: سیگنال‌های تایم‌فریم
# پایین (۱۵ دقیقه‌ای) با مدل قبلی می‌توانستند چند دقیقه دیر برسند - هم به‌خاطر تاخیر
# زمان‌بندی خودِ GitHub Actions (که تضمین‌شده نیست) و هم چون هیچ رهگیری‌ای بین دو اجرا
# وجود نداشت. حالا (دقیقاً مثل candle_engine.py) به‌صورت یک پروسه‌ی پیوسته تا حدود
# ۵ ساعت و ۲۰ دقیقه اجرا می‌ماند: یک اتصال WebSocket زنده به Coinbase برای واچ‌لیست آلت‌کوین (SOL/XRP) نگه می‌دارد (دقت زیر ۱۰ ثانیه، بدون هیچ هزینه‌ی API) و هر ۵ دقیقه هم یک دور
# اسکن کامل (سیگنال جدید در همه‌ی گروه‌ها + رهگیری REST طلا) انجام می‌دهد.
#
# 🔴 (تضمین «تحت هیچ شرایطی قطعی نداشته باشیم») cron از «هر ۵ ساعت» به «هر ۱۰ دقیقه»
# تغییر کرد. علتش این نیست که هر بار واقعاً یک اجرای جدید شروع بشه - چون هر اجرا
# ~۵ ساعت و ۲۰ دقیقه طول می‌کشد و concurrency (پایین) با cancel-in-progress:false
# تضمین می‌کند فقط یک اجرا هم‌زمان کار کند، اکثر این تریگرهای ۱۰-دقیقه‌ای فقط در صف
# منتظر می‌مانند و با رسیدن تریگر بعدی جایگزین (superseded) می‌شوند - هیچ هزینه‌ی
# runner-minute اضافه‌ای ندارند. فایده‌اش برای زمانی است که اجرای در حال کار به هر
# دلیل کاملاً غیرمنتظره‌ای (crash کامل پروسه، قطعی خودِ زیرساخت GitHub Actions runner،
# و مثل‌اش) زودتر از موعد (نه بعد از ۵ ساعت و ۲۰ دقیقه‌ی کامل) متوقف شود: با cron
# قبلی (هر ۵ ساعت)، در بدترین حالت تا ~۵ ساعت هیچ اجرای جایگزینی در صف نبود و کانال
# کاملاً ساکت می‌ماند. با cron هر ۱۰ دقیقه، همیشه یک تریگر تازه (حداکثر ۱۰ دقیقه قبل)
# در صف منتظر است و بلافاصله بعد از پایان اجرای قبلی (چه طبیعی چه ناگهانی) شروع
# می‌شود - یعنی بدترین‌حالتِ قطعی از ~۵ ساعت به حداکثر چند دقیقه رسید. سطح پایتون هم
# (main در bot.py) الان کل بدنه‌ی اجرا را زیر یک try/except/finally جامع دارد که حتی
# قبل از شروع حلقه‌ی اصلی هم خطاها را می‌گیرد، state را ذخیره/پوش می‌کند و به ادمین
# هشدار می‌فرستد - این cron مکرر صرفاً پشتِ آن محافظت، شکاف زمانی را هم می‌بندد.
#
# 🔴🔴 لایه‌ی نهایی (رفع قطعیِ «بعد از ۵ ساعت و ۲۰ دقیقه ادامه پیدا نمی‌کند»): مدل
# بالا («همیشه یک تریگر schedule تازه در صف منتظر است») به این فرض متکی است که
# رویدادهای schedule خودِ GitHub همیشه (یا حداقل به‌طور معقول منظم) سر وقت اتفاق
# می‌افتند - چیزی که مستندات رسمی گیت‌هاب صراحتاً تضمینش نمی‌کند («the schedule
# event can be delayed during periods of high loads»). به همین دلیل، آخرین مرحله‌ی
# این job («Trigger next run immediately») دیگر منتظر تیک بعدیِ cron نمی‌ماند: خودِ
# همین اجرا، درست همان لحظه که کارش (هر طور، طبیعی یا با خطا) تمام می‌شود، مستقیماً
# از طریق GitHub API یک اجرای workflow_dispatch جدید تریگر می‌کند - که طبق همان
# concurrency پایین، بلافاصله بعد از پایان کامل این job شروع می‌شود؛ عملاً شکاف
# احتمالی از «تا ۱۰ دقیقه» به «چند ثانیه» می‌رسد. cron هر ۱۰ دقیقه حذف نشد - فقط
# لایه‌ی دوم پشتیبان است، برای وقتی خودِ آن فراخوانی API شکست بخورد.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_run_all:
        description: "اجرای فوری همه‌ی اسکن‌ها صرف‌نظر از ساعت (برای تست)"
        required: false
        default: "false"
      quick_test_seconds:
        description: "برای تست سریع: چند ثانیه فقط اجرا شود (خالی=اجرای کامل ۵ ساعت و ۲۰ دقیقه)"
        required: false
        default: ""

permissions:
  contents: write
  # 🔴 لازم برای مرحله‌ی جدید «Trigger next run immediately» پایین همین فایل - بدون
  # این permission، GITHUB_TOKEN اجازه‌ی صدا زدن workflow_dispatch API را ندارد.
  actions: write

concurrency:
  group: tradeiscool-signals
  cancel-in-progress: false   # اجرای قبلی هیچ‌وقت به‌زور لغو نمی‌شه، فقط اجرای جدید صف می‌مونه

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity (for periodic auto-commits)
        run: |
          git config user.name "tradeiscool-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run bot (continuous loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          # 🆕 برای هشدار فوری به ادمین در تلگرام هنگام خطای بحرانی (notify_admin در
          # bot.py) - اختیاری؛ اگر این secret ست نشود، هشدارها فقط در لاگ Actions
          # می‌مانند و هیچ خطایی هم رخ نمی‌دهد.
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
          LOOP_MAX_SECONDS: ${{ github.event.inputs.quick_test_seconds }}
        run: |
          python bot.py

      - name: Final commit (safety net)
        if: always()
        run: |
          git rebase --abort || true
          # 🔴 رفع یک ناهماهنگیِ واقعی با git_commit_and_push در bot.py: آن تابع (هر ~۲
          # دقیقه در حین اجرا) علاوه بر state.json، signal_id_counter.json و
          # daily_report_log.json را هم - اگر روی دیسک موجود باشند - commit می‌کند
          # (توضیح کامل بالای git_commit_and_push در bot.py: این دو فایل عمداً خارج از
          # state.json/چرخه‌ی backup-revert آن نگه داشته شدند - یکی برای جلوگیری از
          # تکرارِ signal_id، دیگری برای جلوگیری از ارسال دوباره‌ی گزارش روزانه). اما این
          # مرحله‌ی «safety net» (که تنها راهیه که آخرین لحظه‌ی یک اجرا - بعد از آخرین تیکِ
          # داخلیِ ۲-دقیقه‌ای، درست قبل از خروج پروسه - رو هم پوشش می‌ده) قبلاً فقط
          # state.json را git add می‌کرد. یعنی اگر دقیقاً در همون چند ثانیه‌ی آخر یک
          # signal_id تازه صادر می‌شد یا پرچم گزارش روزانه ست می‌شد و پروسه بلافاصله بعدش
          # (crash/timeout) از بین می‌رفت، این safety net اون دو فایل رو نمی‌دید و
          # commit/push نمی‌کرد - یعنی اجرای بعدی (checkout تازه از ریموت) دوباره از یک
          # شمارنده/پرچمِ قدیمی‌تر شروع می‌کرد: دقیقاً همون دو باگی که خودِ کامنت بالای
          # git_commit_and_push در bot.py توضیح می‌ده این معماری قرار بود حذفشون کنه. الان
          # این مرحله هم دقیقاً همون سه فایل رو (با همون چک وجودِ شرطی - چون در اولین اجرا
          # روی یک ریپوی تازه، signal_id_counter.json/daily_report_log.json ممکنه هنوز
          # ساخته نشده باشن و `git add` روی یک فایلِ ناموجود با خطا کل دستور رو متوقف
          # می‌کنه) اضافه می‌کنه.
          FILES_TO_ADD="state.json"
          for extra in signal_id_counter.json daily_report_log.json; do
            if [ -f "$extra" ]; then
              FILES_TO_ADD="$FILES_TO_ADD $extra"
            fi
          done
          git add $FILES_TO_ADD
          if git diff --quiet --cached; then
            echo "ℹ️ هیچ تغییر جدیدی در state.json نبود - چیزی برای کامیت نیست."
          else
            git commit -m "update state [skip ci]"
          fi

          # 🔴 رفعِ قطعیِ باگِ «گزارش روزانه بیش از یک‌بار ارسال می‌شود» (ریشه‌ی واقعی
          # که در بازبینی کد پیدا شد): قبلاً این مرحله فقط زمانی وارد بلوک push
          # می‌شد که *همین‌جا* چیزی تازه برای کامیت پیدا شود (git diff --cached).
          # اما خودِ bot.py هر ۲ دقیقه یک‌بار (git_commit_and_push) سعی می‌کند
          # کامیت و پوش کند؛ اگر یک‌بار کامیتِ محلی موفق می‌شد ولی push (حتی بعد
          # از ۳ تلاش داخلی) به‌خاطر یک شکست موقتی شبکه/GitHub API شکست می‌خورد،
          # آن کامیت (که می‌توانست شامل پرچم «گزارش امروز فرستاده شد» باشد) در
          # تاریخچه‌ی محلی می‌ماند اما هرگز پوش نمی‌شد. چون working tree همان لحظه
          # با HEAD یکی است، اینجا «git diff --cached» چیزی نشان نمی‌داد و کل این
          # مرحله بی‌خیال push می‌شد - یعنی آن کامیتِ پوش‌نشده (و پرچم داخلش) با
          # پاک‌شدن runner برای همیشه گم می‌شد و اجرای بعدی دوباره due می‌دیدش.
          # راه‌حل: صرف‌نظر از این‌که بالا کامیت جدیدی زده شد یا نه، همیشه چک
          # می‌کنیم آیا اصلاً کامیتی جلوتر از ریموت (ahead/unpushed) هست، و اگر
          # هست تلاش برای push انجام می‌شود.
          AHEAD=$(git rev-list --count @{u}..HEAD 2>/dev/null || echo 0)
          if [ "$AHEAD" = "0" ]; then
            echo "ℹ️ هیچ کامیت پوش‌نشده‌ای وجود نداره - چیزی برای push نیست."
            exit 0
          fi

          echo "📤 $AHEAD کامیت پوش‌نشده پیدا شد - تلاش برای push..."
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}"; then
              if git push; then
                echo "✅ state.json با موفقیت پوش شد (تلاش $i)."
                exit 0
              fi
            else
              echo "⚠️ rebase ناموفق بود (تلاش $i) - لغو و تلاش دوباره"
              git rebase --abort || true
            fi
            echo "⚠️ پوش ناموفق بود (تلاش $i/۳)"
            sleep 5
          done
          echo "❌ پوش نهایی بعد از ۳ تلاش هم ناموفق بود - علامت‌های state.json (از جمله گزارش روزانه) روی ریموت ذخیره نشدند و ممکن است اجرای بعدی دوباره due ببیندشان."

      # 🔴🔴 رفعِ قطعیِ باگِ «بعد از ~۵ ساعت و ۲۰ دقیقه ربات متوقف می‌شود و خودکار ادامه
      # پیدا نمی‌کند»: تا اینجا تنها تضمینِ ادامه‌ی خودکار، cron هر ۱۰ دقیقه +
      # concurrency (پایین این فایل) بود - یعنی «همیشه یک اجرای تازه در صف منتظر
      # است تا اجرای فعلی تمام شود». این تئوری درست است، ولی به یک فرض حیاتی متکی
      # است که خودِ مستندات GitHub هم صریحاً تضمینش نمی‌کند: «رویداد schedule دقیقاً
      # سرِ زمان (یا حتی نزدیک آن) اجرا می‌شود». طبق مستندات رسمی GitHub Actions:
      # «the schedule event can be delayed during periods of high loads» - و در
      # عمل این تاخیر گاهی چند دقیقه، گاهی (در بارهای سنگین سراسری GitHub) خیلی
      # بیشتر است؛ چون این ربات کاملاً به یک تریگر schedule تازه برای *صف‌شدن*
      # وابسته بود، هر تاخیر/افت‌ِ نامنظمِ خودِ زیرساخت زمان‌بندی گیت‌هاب مستقیماً به
      # شکاف در پوشش سیگنال‌دهی تبدیل می‌شد - چیزی که هیچ تغییری در signals.yml یا
      # bot.py (چون هر دو فقط *داخل* یک اجرا را کنترل می‌کنند، نه اینکه اجرای بعدی
      # کِی تریگر شود) نمی‌توانست رفعش کند.
      #
      # راه‌حل واقعی: به‌جای اتکای صرف به قابلیت اطمینانِ نه‌چندان تضمین‌شده‌ی خودِ
      # schedule، همین اجرا در همین لحظه (دقیقاً وقتی کارش تمام می‌شود - چه طبیعی
      # بعد از ۵ ساعت و ۲۰ دقیقه، چه با خطای کامل، چه با timeout ۳۴۰ دقیقه‌ای بالا)
      # مستقیماً از طریق GitHub REST API خودش را دوباره (workflow_dispatch)
      # تریگر می‌کند - بدون نیاز به منتظر ماندنِ تیک بعدیِ cron. چون این مرحله
      # `if: always()` است (دقیقاً مثل مرحله‌ی قبلی)، صرف‌نظر از اینکه بقیه‌ی
      # مراحل/خودِ bot.py موفق بودند یا نه، همیشه اجرا می‌شود. cron هر ۱۰ دقیقه
      # هم عمداً حذف نشد - به‌عنوان لایه‌ی دوم پشتیبان می‌ماند، برای زمانی که همین
      # فراخوانی API (مثلاً به‌خاطر یک قطعی موقتی شبکه/GitHub API) شکست بخورد؛
      # در آن حالت، حداکثر ۱۰ دقیقه بعد cron خودش جایگزین را صف می‌کند - دقیقاً
      # همان محافظت قبلی، فقط این‌بار به‌عنوان fallback نه تنها راه.
      #
      # نکته‌ی مهم درباره‌ی تست دستی: اگر این اجرا از طریق «Run workflow» با
      # quick_test_seconds پر شده تریگر شده باشد (یعنی صرفاً یک تست کوتاه بوده، نه
      # اجرای واقعی)، این مرحله رد می‌شود - یک تست چند‌ثانیه‌ای نباید خودکار یک
      # اجرای واقعی و کامل ۵ ساعت و ۲۰ دقیقه‌ای دیگر را هم زنجیره کند. برای اجراهای
      # عادی (schedule) یا اجرای دستیِ کامل (بدون quick_test_seconds)، همیشه انجام
      # می‌شود.
      - name: Trigger next run immediately (don't wait for the next cron tick)
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.quick_test_seconds == '') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔗 تلاش برای تریگر فوری اجرای بعدی (workflow_dispatch) - بدون منتظرماندن برای cron..."
          for i in 1 2 3; do
            if gh workflow run "signals.yml" --ref "${{ github.ref_name }}" -R "${{ github.repository }}"; then
              echo "✅ اجرای بعدی با موفقیت تریگر شد (تلاش $i) - طبق concurrency (پایین این"
              echo "   فایل) پشتِ همین اجرا صف می‌شود و بلافاصله بعد از پایان کامل همین job شروع می‌شود."
              exit 0
            fi
            echo "⚠️ تریگر ناموفق بود (تلاش $i/۳)"
            sleep 5
          done
          echo "❌ تریگر فوری بعد از ۳ تلاش هم ناموفق بود - نگران نباش، cron هر ۱۰ دقیقه (لایه‌ی"
          echo "   دوم پشتیبان) حداکثر تا ۱۰ دقیقه‌ی دیگر خودش اجرای جایگزین را صف می‌کند."
          exit 0
