name: Tradeiscool Signals

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force_run_all:
        description: 'اجرای فوری همه‌ی اسکن‌ها صرف‌نظر از ساعت (برای تست)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: tradeiscool-signals
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
        run: python bot.py

      - name: Commit updated state.json
        run: |
          git config user.name "tradeiscool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git push
