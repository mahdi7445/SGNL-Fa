name: Tradeiscool Signals

# ⚠️ این ورک‌فلو دیگر «هر ۱۵ دقیقه اجرا و خروج» نیست. علت تغییر: سیگنال‌های تایم‌فریم
# پایین (۱۵ دقیقه‌ای) با مدل قبلی می‌توانستند چند دقیقه دیر برسند - هم به‌خاطر تاخیر
# زمان‌بندی خودِ GitHub Actions (که تضمین‌شده نیست) و هم چون هیچ رهگیری‌ای بین دو اجرا
# وجود نداشت. حالا (دقیقاً مثل candle_engine.py) به‌صورت یک پروسه‌ی پیوسته تا حدود
# ۵ ساعت و ۲۰ دقیقه اجرا می‌ماند: یک اتصال WebSocket زنده به Coinbase برای واچ‌لیست آلت‌کوین (SOL/XRP) نگه می‌دارد (دقت زیر ۱۰ ثانیه، بدون هیچ هزینه‌ی API) و هر ۵ دقیقه هم یک دور
# اسکن کامل (سیگنال جدید در همه‌ی گروه‌ها + رهگیری REST طلا) انجام می‌دهد.
#
# 🔴 (تضمین «تحت هیچ شرایطی قطعی نداشته باشیم») cron از «هر ۵ ساعت» به «هر ۱۰ دقیقه»
# تغییر کرد. علتش این نیست که هر بار واقعاً یک اجرای جدید شروع بشه - چون هر اجرا
# ~۵ ساعت و ۲۰ دقیقه طول می‌کشد و concurrency (پایین) با cancel-in-progress:false
# تضمین می‌کند فقط یک اجرا هم‌زمان کار کند، اکثر این تریگرهای ۱۰-دقیقه‌ای فقط در صف
# منتظر می‌مانند و با رسیدن تریگر بعدی جایگزین (superseded) می‌شوند - هیچ هزینه‌ی
# runner-minute اضافه‌ای ندارند. فایده‌اش برای زمانی است که اجرای در حال کار به هر
# دلیل کاملاً غیرمنتظره‌ای (crash کامل پروسه، قطعی خودِ زیرساخت GitHub Actions runner،
# و مثل‌اش) زودتر از موعد (نه بعد از ۵ ساعت و ۲۰ دقیقه‌ی کامل) متوقف شود: با cron
# قبلی (هر ۵ ساعت)، در بدترین حالت تا ~۵ ساعت هیچ اجرای جایگزینی در صف نبود و کانال
# کاملاً ساکت می‌ماند. با cron هر ۱۰ دقیقه، همیشه یک تریگر تازه (حداکثر ۱۰ دقیقه قبل)
# در صف منتظر است و بلافاصله بعد از پایان اجرای قبلی (چه طبیعی چه ناگهانی) شروع
# می‌شود - یعنی بدترین‌حالتِ قطعی از ~۵ ساعت به حداکثر چند دقیقه رسید. سطح پایتون هم
# (main در bot.py) الان کل بدنه‌ی اجرا را زیر یک try/except/finally جامع دارد که حتی
# قبل از شروع حلقه‌ی اصلی هم خطاها را می‌گیرد، state را ذخیره/پوش می‌کند و به ادمین
# هشدار می‌فرستد - این cron مکرر صرفاً پشتِ آن محافظت، شکاف زمانی را هم می‌بندد.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_run_all:
        description: "اجرای فوری همه‌ی اسکن‌ها صرف‌نظر از ساعت (برای تست)"
        required: false
        default: "false"
      quick_test_seconds:
        description: "برای تست سریع: چند ثانیه فقط اجرا شود (خالی=اجرای کامل ۵ ساعت و ۲۰ دقیقه)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tradeiscool-signals
  cancel-in-progress: false   # اجرای قبلی هیچ‌وقت به‌زور لغو نمی‌شه، فقط اجرای جدید صف می‌مونه

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity (for periodic auto-commits)
        run: |
          git config user.name "tradeiscool-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run bot (continuous loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          # 🆕 برای هشدار فوری به ادمین در تلگرام هنگام خطای بحرانی (notify_admin در
          # bot.py) - اختیاری؛ اگر این secret ست نشود، هشدارها فقط در لاگ Actions
          # می‌مانند و هیچ خطایی هم رخ نمی‌دهد.
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
          LOOP_MAX_SECONDS: ${{ github.event.inputs.quick_test_seconds }}
        run: |
          python bot.py

      - name: Final commit (safety net)
        if: always()
        run: |
          git rebase --abort || true
          git add state.json
          if git diff --quiet --cached; then
            echo "ℹ️ هیچ تغییر جدیدی در state.json نبود - چیزی برای کامیت نیست."
          else
            git commit -m "update state [skip ci]"
          fi

          # 🔴 رفعِ قطعیِ باگِ «گزارش روزانه بیش از یک‌بار ارسال می‌شود» (ریشه‌ی واقعی
          # که در بازبینی کد پیدا شد): قبلاً این مرحله فقط زمانی وارد بلوک push
          # می‌شد که *همین‌جا* چیزی تازه برای کامیت پیدا شود (git diff --cached).
          # اما خودِ bot.py هر ۲ دقیقه یک‌بار (git_commit_and_push) سعی می‌کند
          # کامیت و پوش کند؛ اگر یک‌بار کامیتِ محلی موفق می‌شد ولی push (حتی بعد
          # از ۳ تلاش داخلی) به‌خاطر یک شکست موقتی شبکه/GitHub API شکست می‌خورد،
          # آن کامیت (که می‌توانست شامل پرچم «گزارش امروز فرستاده شد» باشد) در
          # تاریخچه‌ی محلی می‌ماند اما هرگز پوش نمی‌شد. چون working tree همان لحظه
          # با HEAD یکی است، اینجا «git diff --cached» چیزی نشان نمی‌داد و کل این
          # مرحله بی‌خیال push می‌شد - یعنی آن کامیتِ پوش‌نشده (و پرچم داخلش) با
          # پاک‌شدن runner برای همیشه گم می‌شد و اجرای بعدی دوباره due می‌دیدش.
          # راه‌حل: صرف‌نظر از این‌که بالا کامیت جدیدی زده شد یا نه، همیشه چک
          # می‌کنیم آیا اصلاً کامیتی جلوتر از ریموت (ahead/unpushed) هست، و اگر
          # هست تلاش برای push انجام می‌شود.
          AHEAD=$(git rev-list --count @{u}..HEAD 2>/dev/null || echo 0)
          if [ "$AHEAD" = "0" ]; then
            echo "ℹ️ هیچ کامیت پوش‌نشده‌ای وجود نداره - چیزی برای push نیست."
            exit 0
          fi

          echo "📤 $AHEAD کامیت پوش‌نشده پیدا شد - تلاش برای push..."
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}"; then
              if git push; then
                echo "✅ state.json با موفقیت پوش شد (تلاش $i)."
                exit 0
              fi
            else
              echo "⚠️ rebase ناموفق بود (تلاش $i) - لغو و تلاش دوباره"
              git rebase --abort || true
            fi
            echo "⚠️ پوش ناموفق بود (تلاش $i/۳)"
            sleep 5
          done
          echo "❌ پوش نهایی بعد از ۳ تلاش هم ناموفق بود - علامت‌های state.json (از جمله گزارش روزانه) روی ریموت ذخیره نشدند و ممکن است اجرای بعدی دوباره due ببیندشان."
