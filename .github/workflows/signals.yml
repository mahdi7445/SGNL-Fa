name: Tradeiscool Signals

on:
  schedule:
    # هر ۱۵ دقیقه اجرا می‌شود (برای پشتیبانی از تایم‌فریم‌های ۵ و ۱۵ دقیقه‌ای).
    # عمداً روی دقیقه‌ی ۳ (به‌جای ۰) تنظیم شده، نه ۰،۱۵،۳۰،۴۵: طبق مستندات خودِ
    # GitHub، دقیقه‌ی صفر هر ساعت/ربع‌ساعت شلوغ‌ترین لحظه‌ی صف اجرای Actions در کل
    # دنیاست و باعث می‌شود اجرای زمان‌بندی‌شده با تاخیر (گاهی چند تا چند-ده دقیقه)
    # شروع شود - که خودش علت اصلی «سیگنال دیر می‌رسد» بود. افست‌کردن ۳ دقیقه‌ای این
    # ازدحام را دور می‌زند. (bot.py با is_timeframe_due/tf_windows در state.json
    # هوشمندانه پیگیری می‌کند که هر پنجره‌ی زمانی چک شده یا نه، پس حتی اگر یک اجرا
    # هم دیر شروع شود، آن پنجره گم نمی‌شود.)
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      force_run_all:
        description: 'اجرای فوری همه‌ی اسکن‌ها صرف‌نظر از ساعت (برای تست)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: tradeiscool-signals
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
        run: |
          echo "🔍 طول TWELVEDATA_API_KEY: ${#TWELVEDATA_API_KEY}"
          echo "🔍 طول TD_API_KEY: ${#TD_API_KEY}"
          python bot.py

      - name: Commit updated state.json
        run: |
          git config user.name "tradeiscool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --quiet --cached; then
            echo "ℹ️ هیچ تغییری در state.json نبود - چیزی برای کامیت نیست."
          else
            git commit -m "update state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
            echo "✅ state.json با موفقیت کامیت و پوش شد."
          fi
