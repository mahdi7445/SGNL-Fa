name: Tradeiscool Signals

# ⚠️ این ورک‌فلو دیگر «هر ۱۵ دقیقه اجرا و خروج» نیست. علت تغییر: سیگنال‌های تایم‌فریم
# پایین (۱۵ دقیقه‌ای) با مدل قبلی می‌توانستند چند دقیقه دیر برسند - هم به‌خاطر تاخیر
# زمان‌بندی خودِ GitHub Actions (که تضمین‌شده نیست) و هم چون هیچ رهگیری‌ای بین دو اجرا
# وجود نداشت. حالا (دقیقاً مثل candle_engine.py) به‌صورت یک پروسه‌ی پیوسته تا حدود
# ۵ ساعت و ۲۰ دقیقه اجرا می‌ماند: یک اتصال WebSocket زنده به Coinbase برای بیت‌کوین/
# اتریوم نگه می‌دارد (دقت زیر ۱۰ ثانیه، بدون هیچ هزینه‌ی API) و هر ۵ دقیقه هم یک دور
# اسکن کامل (سیگنال جدید در همه‌ی گروه‌ها + رهگیری REST طلا) انجام می‌دهد.
#
# فاصله‌ی کرون (۵ ساعت) از مدت هر اجرا (۵ ساعت و ۲۰ دقیقه) کوتاه‌تره تا هیچ‌وقت شکاف/
# خاموشی نداشته باشیم - وقتی اجرای بعدی باید شروع بشه، اجرای قبلی هنوز فعاله و در صف
# قرار می‌گیره (concurrency)، و به‌محض پایان اجرای قبلی بلافاصله شروع می‌شه.

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      force_run_all:
        description: "اجرای فوری همه‌ی اسکن‌ها صرف‌نظر از ساعت (برای تست)"
        required: false
        default: "false"
      quick_test_seconds:
        description: "برای تست سریع: چند ثانیه فقط اجرا شود (خالی=اجرای کامل ۵ ساعت و ۲۰ دقیقه)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tradeiscool-signals
  cancel-in-progress: false   # اجرای قبلی هیچ‌وقت به‌زور لغو نمی‌شه، فقط اجرای جدید صف می‌مونه

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity (for periodic auto-commits)
        run: |
          git config user.name "tradeiscool-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run bot (continuous loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
          LOOP_MAX_SECONDS: ${{ github.event.inputs.quick_test_seconds }}
        run: |
          echo "🔍 طول TWELVEDATA_API_KEY: ${#TWELVEDATA_API_KEY}"
          echo "🔍 طول TD_API_KEY: ${#TD_API_KEY}"
          python bot.py

      - name: Final commit (safety net)
        if: always()
        run: |
          git add state.json
          if git diff --quiet --cached; then
            echo "ℹ️ هیچ تغییری در state.json نبود - چیزی برای کامیت نیست."
          else
            git commit -m "update state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
            echo "✅ state.json با موفقیت کامیت و پوش شد."
          fi
