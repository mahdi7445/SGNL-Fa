
name: Debug Secrets
 
on:
  workflow_dispatch: {}
 
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret lengths (values never shown)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          LIVECOINWATCH_API_KEY: ${{ secrets.LIVECOINWATCH_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
        run: |
          echo "TELEGRAM_BOT_TOKEN length: ${#TELEGRAM_BOT_TOKEN}"
          echo "COINMARKETCAP_API_KEY length: ${#COINMARKETCAP_API_KEY}"
          echo "LIVECOINWATCH_API_KEY length: ${#LIVECOINWATCH_API_KEY}"
          echo "TWELVEDATA_API_KEY length: ${#TWELVEDATA_API_KEY}"
          echo "TD_API_KEY length: ${#TD_API_KEY}"
          echo "---"
          echo "لیست تمام Secretهایی که GitHub برای این اجرا می‌شناسد (فقط اسم‌ها؛ مقدارها خودکار توسط GitHub با *** پوشانده می‌شوند):"
          echo '${{ toJSON(secrets) }}'
 
